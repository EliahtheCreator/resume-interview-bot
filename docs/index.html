<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 面试资料库</title>
    <meta name="theme-color" content="#176b5d" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Interview Prep Library</p>
          <h1>AI 面试资料库</h1>
          <p class="lede">面向求职者的免费岗位资料库：岗位画像、考察维度、知识地图、高频问答、错误范本、追问方向、回答框架、评分 Rubric 和参考来源。</p>
        </div>
        <div class="mode-badge">无需登录 · 不接 API · 纯资料库</div>
      </header>

      <section class="role-tabs" id="role-tabs" aria-label="选择岗位"></section>
      <section id="library-content" class="library-content"></section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
